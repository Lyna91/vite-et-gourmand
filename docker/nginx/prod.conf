# Configuration nginx de PRODUCTION (serveur OVH) : HTTPS
# En local=> default.conf (pas de certificat).

# 1. Toute visite en HTTP est redirigée vers l'adresse HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://vite-et-gourmand.lynamaker.fr$request_uri;
}

# 2. Le site en HTTPS
server {
    listen 443 ssl;
    server_name vite-et-gourmand.lynamaker.fr;

    ssl_certificate     /etc/letsencrypt/live/vite-et-gourmand.lynamaker.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vite-et-gourmand.lynamaker.fr/privkey.pem;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}